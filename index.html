<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<title>وفّر — افحص عرض صيانة سيارتك</title>

<style>
:root{
  --g:#075b43;
  --g2:#0b7658;
  --bg:#f5f8f7;
  --card:#fff;
  --text:#14201d;
  --muted:#6b7773;
  --line:#dce6e2;
  --warn:#a85b00;
  --warnbg:#fff5df;
  --red:#b42318;
  --redbg:#fff0ee;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#fbfdfc;
  padding:20px 18px 32px;
}

.brand{text-align:center;margin:8px 0 22px}

.logo{
  font-size:48px;
  font-weight:900;
  color:var(--g);
  line-height:1;
}

.tag{color:var(--muted);margin-top:8px}

h1{
  font-size:27px;
  line-height:1.5;
  margin:10px 0;
  text-align:center;
}

.lead{
  text-align:center;
  color:var(--muted);
  line-height:1.8;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 7px 25px rgba(12,70,54,.06);
}

.upload{
  border:2px dashed #a8c3b9;
  text-align:center;
  cursor:pointer;
  padding:30px 16px;
}

.upload strong{
  display:block;
  font-size:18px;
  margin:10px;
}

.upload small{color:var(--muted)}

input,select{
  width:100%;
  border:1px solid #cad9d4;
  border-radius:13px;
  padding:14px;
  background:#fff;
  font-size:16px;
  margin-top:7px;
}

label{
  display:block;
  margin:12px 0 4px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  background:var(--g);
  color:white;
  margin-top:14px;
}

button.secondary{
  background:#e8f3ef;
  color:var(--g);
}

input:focus,
select:focus{
