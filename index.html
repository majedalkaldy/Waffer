<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075b43">
<meta name="description" content="وفّر — افحص وضوح عرض صيانة سيارتك وأدلة مطابقة القطع قبل الدفع.">
<title>وفّر — افحص عرض صيانة سيارتك</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--g:#075b43;--bg:#f5f8f7;--line:#dce6e2;--muted:#586760;--warn:#fff4dd;--text:#14201d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.75}
.app{max-width:620px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom));background:#fbfdfc}
.brand{text-align:center;margin:18px 0}.logo{font-size:48px;font-weight:900;color:var(--g);line-height:1.3}.tag,.note,.lead{color:var(--muted)}.note{font-size:13px}.lead{text-align:center}.toolbar,.nav{display:flex;gap:10px;align-items:center}.toolbar{justify-content:space-between}.toolbar select{width:auto}.nav{flex-wrap:wrap}.nav>*{flex:1;min-width:140px}
h1{font-size:27px;line-height:1.5;text-align:center}h2{font-size:23px}h3{font-size:18px}h1,h2,h3{margin:12px 0}
.card{padding:18px;border:1px solid var(--line);border-radius:18px;background:white;margin:14px 0;box-shadow:0 7px 25px rgba(12,70,54,.04)}
label{display:block;font-weight:700;margin-top:10px}input,select,textarea,button{font:inherit;border-radius:12px;min-height:48px}input,select,textarea{width:100%;padding:11px;border:1px solid #b9ccc3;background:white;margin-top:5px}button{background:var(--g);color:white;border:0;padding:12px 15px;cursor:pointer;font-weight:700;width:100%;margin-top:10px}button.secondary{background:#e8f3ef;color:var(--g)}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #70b398;outline-offset:3px}
.grid,.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scores .card{margin:0;text-align:center}.scores b{display:block;font-size:29px;color:var(--g)}.upload{border:2px dashed #a8c3b9;text-align:center}.upload input{font-size:14px}.upload strong{display:block;overflow-wrap:anywhere}.total{text-align:center;background:#eaf6f1;border-radius:14px;padding:16px}.total b{display:block;color:var(--g);font-size:32px}.notice{background:#f0f4f3;border-radius:12px;padding:12px;margin:10px 0;overflow-wrap:anywhere}.warning{background:var(--warn)}.error{background:#fff0ee;color:#8a2018}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}th,td{text-align:start;vertical-align:top;padding:10px 6px;border-bottom:1px solid var(--line)}.candidate{padding:12px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.candidate p{margin:4px 0}.break{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;direction:ltr;text-align:left}summary{cursor:pointer}textarea{min-height:200px}section[hidden],[hidden]{display:none!important}.spacer{margin-top:16px}
@media(max-width:370px){.grid,.scores{grid-template-columns:1fr}.app{padding-inline:12px}.toolbar{align-items:start}h1{font-size:23px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
 <div class="toolbar"><span class="note" data-i18n="marketLabel">السوق التجريبي: السعودية</span><select id="localeSelect" aria-label="اللغة / Language"><option value="ar-SA">العربية</option><option value="en-SA">English</option></select></div>
 <div class="brand"><div class="logo" data-i18n="appName">وفّر</div><div class="tag" data-i18n="tagline">افحص عرض صيانة سيارتك قبل أن تدفع</div></div>
 <div id="offlineStatus" class="notice warning" role="status" hidden></div>
 <div id="notice" class="notice error" role="alert" hidden></div>
 <noscript><p class="notice error">يلزم تشغيل JavaScript لاستخدام التحليل. JavaScript is required.</p></noscript>
 <section id="home">
  <h1 data-i18n="heroTitle">هل عرض الورشة واضح ومعقول؟</h1>
  <p class="lead" data-i18n="heroLead"></p>
  <div id="systemStatus" class="note" role="status"></div>
  <div class="card upload">
   <label for="file" data-i18n="upload">ارفع صورة العرض أو ملف PDF</label>
   <input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf,.jpg,.jpeg,.png,.webp,.pdf" aria-describedby="uploadHint">
   <strong id="fileText" aria-live="polite"></strong><small id="uploadHint" class="note" data-i18n="uploadHint"></small>
  </div>
  <div class="card">
   <div class="grid"><div><label for="make" data-i18n="make">الشركة</label><select id="make"><option value=""></option></select><button id="retryMakes" class="secondary" type="button" data-i18n="retryMakes" hidden></button></div><div><label for="model" data-i18n="model">الموديل</label><input id="model" dir="auto" maxlength="120"></div></div>
   <label for="year" data-i18n="year">سنة الصنع</label><input id="year" type="number" inputmode="numeric" min="1886" step="1">
   <label for="vin" data-i18n="vinOptional">رقم الهيكل VIN (اختياري)</label><input id="vin" dir="ltr" maxlength="17" autocomplete="off" autocapitalize="characters" spellcheck="false">
   <button id="checkVin" type="button" class="secondary" data-i18n="checkVin"></button>
   <div id="vehicleInfo" class="notice" role="status" hidden></div>
   <div id="vehicleCandidates" hidden><label for="candidateSelect" data-i18n="chooseVehicle"></label><select id="candidateSelect"></select></div>
   <button id="analyzeBtn" type="button" data-i18n="analyze"></button>
   <p class="note" data-i18n="privacy"></p>
  </div>
  <button id="installBtn" type="button" class="secondary" data-i18n="install" hidden></button>
  <button id="updateApp" type="button" class="secondary" data-i18n="updateApp" hidden></button>
 </section>
 <section id="loading" hidden>
  <h1 data-i18n="loadingTitle"></h1><div class="card"><p id="loadingStage" role="status" aria-live="polite"></p><p id="elapsedTime" class="note" aria-hidden="true"></p><p class="note" data-i18n="progressNote"></p><button id="cancelBtn" type="button" class="secondary" data-i18n="cancel"></button></div>
 </section>
 <section id="result" hidden>
  <h2 data-i18n="resultTitle"></h2>
  <div class="card"><div class="total"><span data-i18n="totalShown"></span><b id="rTotal"></b></div><p id="currencyContext" class="note"></p><p id="rCalculatedTotal" class="note"></p><p id="rTaxLabor" class="note"></p><p id="rWarranty" class="note"></p><p id="rStatus" class="notice"></p></div>
  <div class="scores"><div class="card"><span data-i18n="transparency"></span><b id="rTransparency"></b></div><div class="card"><span data-i18n="identity"></span><b id="rIdentity"></b></div><div class="card"><span data-i18n="compatibility"></span><b id="rCompatibility"></b></div><div class="card"><span data-i18n="priceConfidence"></span><b id="rPrice"></b></div></div>
  <p class="note" data-i18n="scoreNote"></p>
  <div class="card"><h3 data-i18n="findings"></h3><p id="rVehicleEvidence" class="notice"></p><div id="rAlerts"></div><p id="catalogSummary" class="notice" role="status" aria-live="polite"></p><p class="note" data-i18n="savingNote"></p><div class="nav"><button id="detailsBtn" data-i18n="details"></button><button id="workshopBtn" class="secondary" data-i18n="workshopButton"></button></div><button class="secondary" data-view="home" data-i18n="editInput"></button></div>
  <details class="card"><summary data-i18n="diagnostics"></summary><pre id="diagnostics"></pre></details>
 </section>
 <section id="advanced" hidden>
  <h2 data-i18n="advancedTitle"></h2>
  <div class="card"><h3 data-i18n="detailsTitle"></h3><div class="table-wrap"><table><caption class="note" data-i18n="detailsTitle"></caption><thead><tr><th scope="col" data-i18n="lineItem"></th><th scope="col" data-i18n="itemType"></th><th scope="col" data-i18n="partNumber"></th><th scope="col" data-i18n="price"></th><th scope="col" data-i18n="identity"></th><th scope="col" data-i18n="compatibility"></th><th scope="col" data-i18n="priceAssessment"></th><th scope="col" data-i18n="conflict"></th></tr></thead><tbody id="itemsBody"></tbody></table></div></div>
  <div class="card"><h3 data-i18n="catalogMatch"></h3><p class="note" data-i18n="candidateNote"></p><div id="catalogMatches"></div></div>
  <div class="card"><h3 data-i18n="beforePay"></h3><div id="nextActions"></div><p class="notice" data-i18n="confirmedSaving"></p><div class="nav"><button id="followupBtn" data-i18n="workshopFollowup"></button><button id="shareSummaryBtn" class="secondary" data-i18n="shareSummary"></button></div></div>
  <div class="nav"><button class="secondary" data-view="result" data-i18n="back"></button><button id="newAnalysisBtn" data-i18n="newAnalysis"></button></div>
 </section>
 <section id="msg" hidden>
  <h2 data-i18n="workshopMessageTitle"></h2><div class="card"><label for="message" class="note" data-i18n="messageReview"></label><textarea id="message" dir="auto" readonly></textarea><button id="copyMessageBtn" data-i18n="copyMessage"></button><button class="secondary" data-view="result" data-i18n="resultBack"></button></div>
 </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
