name: Waffer CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: waffer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run static and behavioral checks
        run: npm run ci
